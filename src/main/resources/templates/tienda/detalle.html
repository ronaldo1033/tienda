<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Detalle | Tienda Integral</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/tienda.css}"></head><body><nav class="navbar navbar-dark shop-nav"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/}">TI<span>.</span> Tienda Integral</a><a class="btn btn-outline-light btn-sm" th:href="@{/}">← Volver al catálogo</a></div></nav><main class="container py-5"><div class="row g-5 align-items-center"><div class="col-md-5"><div class="detail-art"><span>TI<span>.</span></span></div></div><div class="col-md-7"><span class="eyebrow text-primary" th:text="${producto.categoria.nombre}">Categoría</span><h1 class="display-5 fw-bold mt-2" th:text="${producto.nombre}">Producto</h1><p class="text-secondary fs-5" th:text="${producto.descripcion != null ? producto.descripcion : 'Producto disponible en nuestra tienda.'}"></p><div class="price display-6 my-4" th:text="|S/ ${#numbers.formatDecimal(producto.precio,1,2)}|">S/ 0.00</div><p><strong>Stock:</strong> <span th:text="${producto.stock}"></span> unidades</p><p><strong>Estado:</strong> <span class="badge text-bg-success" th:text="${producto.estado}"></span></p><a th:href="@{/login}" class="btn btn-warning btn-lg">Inicia sesión para comprar</a><p class="small text-secondary mt-3">La compra y el pago en línea aún requieren integrar el flujo de pedidos al frontend.</p></div></div></main></body></html>
