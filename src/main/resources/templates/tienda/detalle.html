<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Detalle | Tienda Integral</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/tienda.css}"></head><body><nav class="navbar navbar-dark shop-nav"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/}">TI<span>.</span> Tienda Integral</a><div class="d-flex gap-2"><a class="btn btn-outline-light btn-sm" th:href="@{/carrito}">Carrito (<span th:text="${cantidadCarrito}">0</span>)</a><a class="btn btn-outline-light btn-sm" th:href="@{/}">← Catálogo</a></div></div></nav><main class="container py-5"><div class="row g-5 align-items-center"><div class="col-md-5"><div class="detail-art"><img th:if="${producto.imagenUrl != null and !producto.imagenUrl.isBlank()}" th:src="${producto.imagenUrl}" th:alt="${producto.nombre}" loading="lazy"><span th:unless="${producto.imagenUrl != null and !producto.imagenUrl.isBlank()}">TI<span>.</span></span></div></div><div class="col-md-7"><span class="eyebrow text-primary" th:text="${producto.categoria.nombre}">Categoría</span><h1 class="display-5 fw-bold mt-2" th:text="${producto.nombre}">Producto</h1><p class="text-secondary fs-5" th:text="${producto.descripcion != null ? producto.descripcion : 'Producto disponible en nuestra tienda.'}"></p><div class="price display-6 my-4" th:text="|S/ ${#numbers.formatDecimal(producto.precio,1,2)}|">S/ 0.00</div><p><strong>Stock:</strong> <span th:text="${producto.stock}"></span> unidades</p><p><strong>Estado:</strong> <span class="badge text-bg-success" th:text="${producto.estado}"></span></p><form method="post" th:action="@{/carrito/agregar}" class="d-flex flex-wrap gap-2 align-items-end mt-4">
<label class="form-label mb-0">Cantidad<input class="form-control mt-1" type="number" name="cantidad" value="1" min="1" th:max="${producto.stock}" required style="width:105px"></label>
<input type="hidden" name="productoId" th:value="${producto.id}">
<button class="btn btn-warning btn-lg" type="submit" th:disabled="${producto.stock < 1}">Agregar al carrito</button>
</form><p class="small text-secondary mt-3">Para finalizar tu pedido, inicia sesión con tu cuenta de cliente.</p></div></div></main></body></html>
