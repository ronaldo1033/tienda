<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mi cuenta | Tienda Integral</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/tienda.css}"></head>
<body><nav class="navbar navbar-dark shop-nav"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/}">TI<span>.</span> Tienda Integral</a><div class="d-flex gap-2"><a class="btn btn-outline-light btn-sm" th:href="@{/carrito}">Carrito (<span th:text="${cantidadCarrito}">0</span>)</a><a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Salir</a></div></div></nav>
<main class="container py-5"><div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4"><div><span class="eyebrow text-primary">ÁREA DEL CLIENTE</span><h1 class="section-title">Mi cuenta</h1><p class="text-secondary mb-0" th:text="|Hola, ${cliente.nombres} ${cliente.apellidos}. Aquí puedes revisar tus pedidos.|"></p></div><a class="btn btn-warning" th:href="@{/}">Seguir comprando</a></div><div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<section class="admin-panel"><h2 class="mb-3">Mis compras</h2><div th:if="${#lists.isEmpty(compras)}" class="empty-state"><h3>Aún no tienes compras</h3><p>Cuando realices un pedido, aparecerá aquí.</p><a class="btn btn-dark" th:href="@{/}">Ver catálogo</a></div><div th:unless="${#lists.isEmpty(compras)}" class="table-responsive"><table class="table align-middle"><thead><tr><th>Pedido</th><th>Fecha</th><th>Productos</th><th>Total</th><th>Estado</th></tr></thead><tbody><tr th:each="compra : ${compras}"><td th:text="|#${compra.id}|"></td><td th:text="${#temporals.format(compra.fecha,'dd/MM/yyyy HH:mm')}"></td><td><div th:each="detalle : ${compra.detalles}" class="small" th:text="|${detalle.producto.nombre} × ${detalle.cantidad}|"></div></td><td class="fw-bold" th:text="|S/ ${#numbers.formatDecimal(compra.total,1,2)}|"></td><td><span class="badge" th:classappend="${compra.estado.name() == 'PAGADA' ? ' text-bg-success' : (compra.estado.name() == 'CANCELADA' ? ' text-bg-danger' : ' text-bg-warning')}" th:text="${compra.estado}"></span></td></tr></tbody></table></div></section></main></body></html>
