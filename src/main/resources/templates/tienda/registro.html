<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Crear cuenta | Tienda Integral</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/tienda.css}"></head><body class="auth-bg"><nav class="navbar navbar-dark shop-nav"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/}">TI<span>.</span> Tienda Integral</a><a class="btn btn-outline-light btn-sm" th:href="@{/}">Volver</a></div></nav><main class="container auth-wrap"><section class="auth-card"><div class="auth-mark">TI<span>.</span></div><span class="eyebrow text-primary">ÚNETE A NOSOTROS</span><h1>Crea tu cuenta</h1><p class="text-secondary">Regístrate gratis para tener tu cuenta de cliente.</p><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form method="post" th:action="@{/registro}" class="mt-4"><label class="form-label">Nombre de usuario</label><input class="form-control form-control-lg mb-3" name="username" minlength="3" required placeholder="Ej. juan23"><label class="form-label">Nombres</label><input class="form-control form-control-lg mb-3" name="nombres" required maxlength="100" placeholder="Tus nombres"><label class="form-label">Apellidos</label><input class="form-control form-control-lg mb-3" name="apellidos" required maxlength="100" placeholder="Tus apellidos"><label class="form-label">DNI / Documento</label><input class="form-control form-control-lg mb-3" name="documento" required maxlength="20" placeholder="Número de documento"><label class="form-label">Teléfono (opcional)</label><input class="form-control form-control-lg mb-3" name="telefono" maxlength="20" placeholder="Tu teléfono"><label class="form-label">Correo electrónico</label><input class="form-control form-control-lg mb-3" type="email" name="correo" required placeholder="tu@correo.com"><label class="form-label">Contraseña</label><input class="form-control form-control-lg mb-3" type="password" name="password" minlength="8" required placeholder="Mínimo 8 caracteres"><label class="form-label">Confirmar contraseña</label><input class="form-control form-control-lg mb-4" type="password" name="confirmarPassword" minlength="8" required placeholder="Repite tu contraseña"><button class="btn btn-warning btn-lg w-100">Crear cuenta</button></form><p class="text-center mt-4 mb-0">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p></section></main></body></html>
