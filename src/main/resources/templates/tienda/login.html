<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Iniciar sesión | Tienda Integral</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/tienda.css}"></head><body class="auth-bg"><nav class="navbar navbar-dark shop-nav"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/}">TI<span>.</span> Tienda Integral</a><a class="btn btn-outline-light btn-sm" th:href="@{/}">Volver</a></div></nav><main class="container auth-wrap"><section class="auth-card"><div class="auth-mark">TI<span>.</span></div><span class="eyebrow text-primary">QUÉ BUENO VERTE</span><h1>Inicia sesión</h1><p class="text-secondary">Accede a tu cuenta de Tienda Integral.</p><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div><form method="post" th:action="@{/login}" class="mt-4"><label class="form-label">Usuario</label><input class="form-control form-control-lg mb-3" name="username" required autocomplete="username" placeholder="Tu nombre de usuario"><label class="form-label">Contraseña</label><input class="form-control form-control-lg mb-4" type="password" name="password" required autocomplete="current-password" placeholder="Tu contraseña"><button class="btn btn-dark btn-lg w-100">Entrar a mi cuenta</button></form><p class="text-center mt-4 mb-0">¿Aún no tienes cuenta? <a th:href="@{/registro}">Regístrate</a></p></section></main></body></html>
