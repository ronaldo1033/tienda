<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Finalizar compra | Tienda Integral</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/tienda.css}"></head>
<body><nav class="navbar navbar-dark shop-nav"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/}">TI<span>.</span> Tienda Integral</a><a class="btn btn-outline-light btn-sm" th:href="@{/carrito}">Volver al carrito</a></div></nav>
<main class="container py-5"><div class="mb-4"><span class="eyebrow text-primary">ÚLTIMO PASO</span><h1 class="section-title">Finalizar compra</h1><p class="text-secondary">Confirma tu dirección y el método de pago.</p></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<div class="row g-4"><div class="col-lg-7"><form method="post" th:action="@{/checkout}" class="admin-panel"><h2 class="mb-3">Datos de entrega</h2><p class="text-secondary small" th:text="|Pedido para ${cliente.nombres} ${cliente.apellidos} · ${cliente.correo}|"></p><label class="form-label">Dirección</label><input class="form-control mb-3" name="direccion" required maxlength="250" placeholder="Av. / Jr. / Calle y número"><div class="row"><div class="col-md-6"><label class="form-label">Distrito</label><input class="form-control mb-3" name="distrito" required maxlength="100"></div><div class="col-md-6"><label class="form-label">Ciudad</label><input class="form-control mb-3" name="ciudad" required maxlength="100"></div></div><label class="form-label">Departamento</label><input class="form-control mb-3" name="departamento" required maxlength="100" value="Lima"><label class="form-label">Referencia (opcional)</label><input class="form-control mb-3" name="referencia" maxlength="250" placeholder="Piso, edificio, referencia..."><hr><h2 class="mb-3">Método de pago</h2><select class="form-select mb-2" name="metodo" required><option value="TRANSFERENCIA_SIMULADA">Transferencia (simulada)</option><option value="TARJETA_SIMULADA">Tarjeta (simulada)</option></select><div class="alert alert-warning small mb-3">Esta tienda está en modo demostración. No se realiza ningún cobro bancario real ni debes ingresar datos de tarjeta.</div><button class="btn btn-warning btn-lg w-100" type="submit">Confirmar pedido</button></form></div>
<div class="col-lg-5"><div class="admin-panel"><h2>Resumen de tu pedido</h2><div th:each="linea : ${lineas}" class="d-flex justify-content-between gap-3 py-2 border-bottom"><div><strong th:text="${linea.producto.nombre}"></strong><div class="small text-secondary" th:text="|Cantidad: ${linea.cantidad}|"></div></div><strong th:text="|S/ ${#numbers.formatDecimal(linea.subtotal,1,2)}|"></strong></div><div class="d-flex justify-content-between pt-3 fs-5"><strong>Total</strong><strong class="price" th:text="|S/ ${#numbers.formatDecimal(total,1,2)}|"></strong></div></div></div></div></main></body></html>
