# Configuración general
spring.application.name=tienda-integral-backend
server.port=${SERVER_PORT:8080}

# Base de datos: H2 en memoria por defecto para desarrollo local.
# Para PostgreSQL define DB_URL, DB_USERNAME, DB_PASSWORD y DB_DRIVER.
spring.datasource.url=${DB_URL:jdbc:h2:mem:tienda_integral;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.jpa.open-in-view=true

# Consola H2 solo para desarrollo local
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# JWT: reemplazar JWT_SECRET en cualquier entorno compartido o productivo.
app.jwt.secret=${JWT_SECRET:VGllbmRhSW50ZWdyYWxEZXZlbG9wbWVudFNlY3JldEtleUZvckpXVFRva2VuMTIzNDU2Nzg5MDEyMzQ1Njc4OTA=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Swagger / OpenAPI y JSON
springdoc.swagger-ui.path=/swagger-ui.html
spring.jackson.serialization.write-dates-as-timestamps=false
