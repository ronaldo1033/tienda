# ============================================================
# CONFIGURACION GENERAL
# ============================================================
spring.application.name=tienda-integral-backend
server.port=8080

# ============================================================
# BASE DE DATOS POSTGRESQL (local)
# Crear previamente la base tienda_integral en pgAdmin.
# Cambia la contraseña si tu usuario postgres usa otra.
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/tienda_integral
spring.datasource.username=postgres
spring.datasource.password=root112233
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.jpa.open-in-view=true

# ============================================================
# JWT - clave codificada en Base64 (minimo 256 bits)
# JwtService decodifica esta propiedad con Base64.getDecoder().
# ============================================================
app.jwt.secret=VGllbmRhSW50ZWdyYWxEZXZlbG9wbWVudFNlY3JldEtleUZvckpXVFRva2VuMTIzNDU2Nzg5MDEyMzQ1Njc4OTA=
app.jwt.expiration-ms=86400000

# ============================================================
# SWAGGER / OPENAPI Y JSON
# ============================================================
springdoc.swagger-ui.path=/swagger-ui.html
spring.jackson.serialization.write-dates-as-timestamps=false
